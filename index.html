<!doctype html>
<html lang="es-ES">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- El vector del logotipo todavía no existe (@s28): no se puede derivar
         un SVG fiel de un raster de 201×201 con degradados y solapes. Camino
         B mientras no llegue el vector del cliente (`progress/plan_imagenes.md`
         §3.3): iconos raster derivados del logo real, comprobados por 200 y
         por tamaño en la suite de navegador real (fuera de esta ronda). -->
    <!-- <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" /> -->
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <!-- Outfit (titulares) y DM Sans (texto), autoalojadas, subconjunto latino
         (Decisiones 32/33, @s19). "crossorigin" es obligatorio aunque el
         fichero sea del mismo origen: MDN, "The attribute needs to be set to
         match the resource's CORS and credentials mode, even when the fetch
         is not cross-origin" — sin él el navegador lo descarga dos veces. -->
    <link rel="preload" href="%BASE_URL%fuentes/outfit-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%BASE_URL%fuentes/dm-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>Galapavet · Centro integral veterinario en Galapagar</title>
    <script>
      // Anti-destello (FOUC): aplica la variante de paleta guardada ANTES del
      // primer pintado, para que el visitante no vea la variante por defecto
      // seguida de un salto a la guardada. Corre antes de que exista el
      // bundle, así que no puede importar código.
      //
      // NO escribe el identificador de la variante por defecto, y eso es
      // deliberado (@s10 de `features/rediseno_visual.feature:233`: "el
      // identificador aparece declarado una sola vez en todo el proyecto").
      // Ese identificador se declara en un único sitio, el catálogo
      // `VARIANTES_REDISENO` de `src/lib/diseno/contratoRedisenho.ts`, y este
      // guion lo CONSUME por complemento: solo lista las variantes que NO son
      // la predeterminada. Ese literal se confronta contra el catálogo en
      // `src/components/SelectorPaleta-logica.test.ts`, que lee este fichero
      // como texto — si el catálogo cambia o cambia cuál es la
      // predeterminada, ese test falla.
      //
      // Sin preferencia guardada, o con una que no es ninguna de estas
      // cuatro, el atributo NO se toca: el documento se pinta con el bloque
      // `:root` sin atributo de `src/styles/_tokens.scss`, que declara los
      // mismos veinte valores que la variante por defecto (@s12, verificado
      // token a token). Así no hay destello y tampoco se escribe basura en el
      // atributo. Cuando React monta, `SelectorPaleta` lo fija al valor que
      // resuelve `resolverVarianteInicial`.
      ;(function aplicarVarianteAntesDelPintado() {
        var CLAVE_ALMACENAMIENTO_VARIANTE = 'galapavet-variante'
        var IDS_NO_PREDETERMINADOS = ['calida', 'tech', 'eco', 'marca']
        try {
          var guardada = window.localStorage.getItem(CLAVE_ALMACENAMIENTO_VARIANTE)
          if (guardada !== null && IDS_NO_PREDETERMINADOS.indexOf(guardada) !== -1) {
            document.documentElement.setAttribute('data-variante', guardada)
          }
        } catch {
          // Intencionalmente silencioso: un almacenamiento no disponible no
          // debe impedir pintar la página. Se queda con la variante por
          // defecto, que es la del bloque `:root` sin atributo.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Técnica de rafgraph/spa-github-pages (MIT License):
      // https://github.com/rafgraph/spa-github-pages
      // Decodifica la ruta que "public/404.html" codificó y la restaura con
      // "history.replaceState" ANTES de que "BrowserRouter" monte, para que
      // el router reciba la ruta real, no la de redirección (Decisión 49).
      // Espejo puro testeable: "src/lib/tecnicaSpaGithubPages.ts" (@s9/@s10).
      ;(function restaurarRutaTrasRedireccion404(l) {
        if (l.search[1] === '/') {
          var rutaDecodificada = l.search
            .slice(1)
            .split('&')
            .map(function (segmento) {
              return segmento.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + rutaDecodificada + l.hash)
        }
      })(window.location)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
