name: Harness CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NO_COLOR: "1"

jobs:
  root-harness:
    name: Arnés raíz (init)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          # El cache de pnpm ya lo gestiona pnpm/action-setup (arriba). Sin este
          # false, actions/setup-node@v5 auto-detecta el campo "packageManager"
          # de package.json y activa su propio caché por defecto
          # (package-manager-cache: true), duplicando el mecanismo de caché.
          package-manager-cache: false
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - run: node .harness/harness.mjs init
      - name: Regresión de configuración de mutación
        run: pnpm run test:config

  python-example:
    name: Ejemplo Python (init + mutación 100%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/python-notes-cli
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          # Este job no usa pnpm (test = "node --test" / unittest, sin
          # package.json propio bajo examples/). Sin este false,
          # actions/setup-node@v5 auto-detecta "packageManager": "pnpm@..."
          # del package.json de la RAÍZ del repo (no respeta el
          # working-directory del job) y falla intentando ejecutar pnpm, que
          # aquí no está instalado.
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: init (entorno + tests)
        run: node ../../.harness/harness.mjs init
      - name: mutación (los 3 módulos deben quedar en 100%)
        run: |
          node ../../.harness/harness.mjs mutate src/notes.py
          node ../../.harness/harness.mjs mutate src/storage.py
          node ../../.harness/harness.mjs mutate src/cli.py

  node-example:
    name: Ejemplo Node (init + mutación 100%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/node-notes-cli
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          # Mismo motivo que en el job python-example: este proyecto de
          # ejemplo no usa pnpm, y el "packageManager" de la raíz del repo se
          # auto-detecta igualmente pese al working-directory del job.
          package-manager-cache: false
      - name: init (entorno + tests)
        run: node ../../.harness/harness.mjs init
      - name: mutación (los 3 módulos deben quedar en 100%)
        run: |
          node ../../.harness/harness.mjs mutate src/notes.mjs
          node ../../.harness/harness.mjs mutate src/storage.mjs
          node ../../.harness/harness.mjs mutate src/cli.mjs
